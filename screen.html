<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live board | Relanto Cricket League</title>
  <meta name="theme-color" content="#0f2a22">
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
    /* Hide-until-animated styles apply only when motion is wanted; if scripts fail, show everything. */
    if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
      document.documentElement.classList.add("motion");
      try {
        if (sessionStorage.getItem("relanto-nav")) {
          document.documentElement.classList.add("curtain-in");
          setTimeout(function () { document.documentElement.classList.remove("curtain-in"); }, 5000);
        }
      } catch (e) { /* storage blocked */ }
      setTimeout(function () { if (!window.__motionReady) document.documentElement.classList.remove("motion"); }, 4500);
    }
  </script>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/motion.css">
  <link rel="stylesheet" href="css/premium.css">
</head>
<body class="screen">
  <div class="stage-curtain" aria-hidden="true"><i class="sc sc-l"></i><i class="sc sc-r"></i></div>
  <main class="wrap screen-wrap" id="main">
    <div class="screen-bar">
      <a class="brand" href="index.html">
        <img class="brand-mark" src="assets/rcl-logo.webp" alt="" width="40" height="50">
        Relanto Cricket League
      </a>
      <a class="co-logo co-logo-head" href="https://www.relanto.ai" target="_blank" rel="noopener noreferrer" aria-label="Relanto"><img src="assets/relanto-wordmark.svg" alt="Relanto" width="394" height="106"></a>
      <div class="panel-row">
        <a class="btn btn-quiet btn-small" href="results.html">Results</a>
        <button class="btn btn-quiet btn-small" id="fs" type="button">Full screen</button>
      </div>
    </div>

    <h1 class="visually-hidden">Live auction board</h1>
    <div class="screen-stage"><div id="lot"></div></div>
    <div class="teams-strip" id="teams"></div>
    <h2 class="visually-hidden">Recent sales</h2>
    <div class="sales" id="sales" aria-live="polite"></div>
  </main>
  <script type="module" src="js/screen.js"></script>
  <script type="module" src="js/premium.js"></script>
</body>
</html>
